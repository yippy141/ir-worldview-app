<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Parallax mark: two sightlines meeting at one point, with the parallax angle marked" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Two observers on an orbit arc sight one point. The small arc is the parallax angle: the thing the instrument measures. -->
  <path d="M6 57 Q32 45 58 57" fill="none" stroke="#CFA95A" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <g stroke="#CFA95A" stroke-linecap="round" fill="none">
    <line x1="13" y1="53.2" x2="29.6" y2="17.4" stroke-width="2.6"/>
    <line x1="51" y1="53.2" x2="34.4" y2="17.4" stroke-width="2.6"/>
    <path d="M27.3 26.2 Q32 28.4 36.7 26.2" stroke-width="1.6"/>
  </g>
  <circle cx="32" cy="12.5" r="4.6" fill="#CFA95A"/>
  <circle cx="13" cy="53.2" r="2.4" fill="#CFA95A"/>
  <circle cx="51" cy="53.2" r="2.4" fill="#CFA95A"/>
</svg>
