<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Departure · Visual walkthrough</title><style>
body{margin:0;background:#0a1322;color:#eef2f7;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font:44px/1.15 Georgia,serif}a{color:#cea857}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;padding:10px;background:#122139;border:1px solid #304563;color:#eef2f7;cursor:pointer}button[aria-current=true]{border-color:#cea857;color:#cea857}button:focus-visible,select:focus-visible{outline:2px solid #cea857;outline-offset:4px}#shot{display:block;width:100%;height:auto;border:1px solid #304563}#shot[data-width="390"]{max-width:390px}#description{max-width:70ch}small{color:#c7d2e0}</style><main><h1>The Departure</h1><p>A visual walkthrough of the English draft. These are captured screens, not an interactive copy of the exercise.</p><p><a href="http://127.0.0.1:3107/futures/departure">Open the playable local draft</a></p><label>Screen width <select id="width"><option value="1440">Desktop · 1440 pixels</option><option value="390">Mobile · 390 pixels</option></select></label><nav aria-label="Walkthrough scenes"><button type="button" data-scene="0" aria-current="true">Read the invitation</button><button type="button" data-scene="1" aria-current="false">A · Consider unknown return terms</button><button type="button" data-scene="2" aria-current="false">B · Reconsider a revised offer</button><button type="button" data-scene="3" aria-current="false">C · Decide what power remains</button><button type="button" data-scene="4" aria-current="false">Review before submitting</button><button type="button" data-scene="5" aria-current="false">Read what the conditions change</button></nav><h2 id="title"></h2><p id="description"></p><img id="shot" alt=""><p><small>Draft departure-0.1-draft · 11 September 2026. Full-width captures include the independently browsable comparison shelf and sources.</small></p></main><script>
const scenes=[["opening","Read the invitation","The story starts with achievements as fictional givens, unknown return terms and a personal or policy framing."],["invitation","A · Consider unknown return terms","Desired conditions, credibility, personal choice and another adult’s freedom remain distinct."],["return","B · Reconsider a revised offer","Only the preference question stipulates a working return service. Credibility and the decision preserve uncertainty."],["authority","C · Decide what power remains","A public mandate, monitoring access and intervention power are answered separately."],["review","Review before submitting","Every choice is visible and editable. Changing an earlier answer clears later responses."],["reading","Read what the conditions change","This example stays initially, allows others to leave and accepts the revised journey. It receives an account of those choices, without a score."]];let index=0;const width=document.querySelector('#width');function show(){const scene=scenes[index];document.querySelector('#title').textContent=scene[1];document.querySelector('#description').textContent=scene[2];const shot=document.querySelector('#shot');shot.src=scene[0]+'-'+width.value+'.png';shot.alt=scene[1]+' at '+width.value+' pixels';shot.dataset.width=width.value;document.querySelectorAll('[data-scene]').forEach(button=>button.setAttribute('aria-current',String(Number(button.dataset.scene)===index)))}document.querySelectorAll('[data-scene]').forEach(button=>button.addEventListener('click',()=>{index=Number(button.dataset.scene);show()}));width.addEventListener('change',show);show();</script></html>
